manifestVersion: 1
id: blake2b-asic-control
name: Blake2b ASIC Control
tagline: A fleet dashboard, presets, schedules and a per-chip auto-tuner for Blake2b miners
icon: https://raw.githubusercontent.com/christhealien/blake2b-asic-control/master/blake2b-asic-control/icon.svg?v=1.15.9
category: developer
version: "1.15.9"
port: 8790
description: >-
  A local control panel for the Blake2b miners on your network: the SC line (SC Lite,
  SC-BOX / SC-BOX II, SC5 Pro / SC5 Pro II) and the HS line (HS Box). Every miner is controlled on
  its own, and nothing leaves your network unless you turn on notifications.


  Fleet: a card per miner with its 20-second hashrate, a 24-hour hashrate graph with marks for
  restarts and setting changes, one-click presets, the pool list, restart and an estimated power
  draw. The Miner page adds the live stats, the same graph, a chip map of every chip on the hash
  boards, the best share (a record that survives restarts) and rejected shares sorted into stale
  (pool timing) and not stale.


  Presets: High, Middle, Low and Lowest power per miner (clock, voltage, PV and the fan curve to run
  them with), plus Idle, the firmware's own sleep mode. The Schedule paints them across a week of
  half-hour blocks, with scheduled restarts on the same grid. Fan curves are drawn by dragging
  points; each miner runs its own.


  The Tuner (SC Lite) maps every clock from underclock to overclock and finds the lowest voltage
  each one runs cleanly, by watching every chip's hardware errors against that chip's own normal
  rate while holding the boards at a temperature you choose. It confirms the winner and builds and
  tests the four presets, each with its own fan curve, and can rebuild the presets later (for
  example at another temperature) without a new search. Several miners can tune at once.


  Notifications go to Telegram or Discord: a miner offline, hot, low hashrate, restarted on its
  own, a tuning run finished, a new best-share record, a weak chip or a share rejected for a
  reason other than stale. Three home-screen widgets show the fleet at a glance.


  Uses the miners' stock web API only: no firmware changes. Sign in with the default username and
  password shown here, then add your miners under Settings (and set your time zone there).
