releaseNotes: |-
  **What's new in 1.14.0: the first public release**

  - **A time zone setting** (Settings → Time zone). Schedules, restarts, logs and tuner files use the
    app's time zone, which is UTC until you pick yours (it offers your browser's).
  - **The 24-hour hashrate graph on the Miner page** too, between Live and Chips, and the Live panel's
    Hashrate shows the latest 20-second reading like the Fleet card (the average since restart under it).
  - **Graph marks that are close together share one label**, with every event in its hover.
  - **Licensed MIT**, with the credits for the projects it builds on (Maveth's web dashboard, MIT;
    crProductGuy's box tools, MIT). The app image is built on GitHub and pulled from
    ghcr.io; the store is this GitHub repo.

  **Earlier versions**

  - **1.13.1:** Fleet card Hashrate tile shows the latest 20-second reading; Idle appears without a probe.
  - **1.13.0:** Rebuild the presets from the last search; Idle preset; 24-hour hashrate graph on the
    Fleet cards; rejected shares sorted into stale and not stale; best-share table shows the top 10.
  - **1.12.1:** The tuner checks the miner accepts a fresh sign-in before it starts.
  - **1.12.0:** Notifications on Telegram and Discord.
  - **1.11.x:** Scheduled restarts; paint the week block by block; "the rest of the time: nothing".
  - **1.10.x:** SC BOX and HS BOX shown as they really run (from real captures); best-share history;
    safer tuner baseline (stock, what it runs now, or your own).
  - **1.9.x:** The tuner maps every clock and voltage; chip health; power estimates; locks; security update.
  - **1.8.x:** Best share tracking; Run plan; stock settings read from the firmware; one repo for the app
    and its store.

  Every version in detail: [CHANGELOG.md](https://github.com/christhealien/blake2b-asic-control/blob/master/CHANGELOG.md)
