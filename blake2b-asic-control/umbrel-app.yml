      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "10.51"
          subtext: "TH/s"
        - title: "Online"
          text: "2/2"
          subtext: "miners"
        - title: "Est. power"
          text: "1.62"
          subtext: "kW"
        - title: "Best share"
          text: "5.42P"
          subtext: ""
  - id: "health"
    type: "two-stats-with-guage"
    refresh: "30s"
    endpoint: "web:8788/widgets/health"
    link: ""
    example:
      type: "two-stats-with-guage"
      link: ""
      items:
        - title: "avg 10.6"
          text: "10.51"
          subtext: "TH"
          progress: 0.99
        - title: "alert 80°"
          text: "63"
          subtext: "°C"
          progress: 0.79
