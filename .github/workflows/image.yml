# Builds the app image (app/) for amd64 and arm64 and pushes it to
# ghcr.io/<owner>/blake2b-asic-control:<version> when a tag like v1.14.0 is pushed.
# Run it by hand too: Actions → image → Run workflow (then it's tagged with the version in the Dockerfile).
# After the first run, make the package public once (GitHub → your profile → Packages →
# blake2b-asic-control → Package settings → Change visibility → Public) so Umbrel can pull it.
name: image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"
          else v=$(sed -n 's/.*image.version="\([^"]*\)".*/\1/p' app/Dockerfile); fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$v" >> "$GITHUB_OUTPUT"; echo "owner=$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/blake2b-asic-control:${{ steps.v.outputs.tag }}
            ghcr.io/${{ steps.v.outputs.owner }}/blake2b-asic-control:latest
